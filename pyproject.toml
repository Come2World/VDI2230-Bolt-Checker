[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi2230-bolt-calculator"
version = "0.1.0"
description = "Local VDI 2230 Part 1 bolt-joint calculation assistant"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vdi2230 = "vdi2230.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
