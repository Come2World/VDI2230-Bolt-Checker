<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDI 2230 · 螺栓连接计算</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>VDI 2230 <span>螺栓连接计算</span></h1>
    <input id="project-title" class="project-title" aria-label="项目标题" maxlength="120" autocomplete="off">
    <span id="status" class="status" role="status">正在加载…</span>
    <span id="verdict" class="verdict" data-status="">—</span>
    <a class="ref-link" href="/reference">参考算例 B1–B5 ↗</a>
  </header>

  <main class="workspace">
    <section class="pane input-pane" aria-label="设计输入">
      <div class="tabs" role="tablist" aria-label="输入分组">
        <button type="button" role="tab" id="tab-bolt" data-tab="bolt" aria-controls="panel-bolt" aria-selected="true">螺栓</button>
        <button type="button" role="tab" id="tab-plates" data-tab="plates" aria-controls="panel-plates" aria-selected="false" tabindex="-1">板层</button>
        <button type="button" role="tab" id="tab-load" data-tab="load" aria-controls="panel-load" aria-selected="false" tabindex="-1">载荷</button>
        <button type="button" role="tab" id="tab-assembly" data-tab="assembly" aria-controls="panel-assembly" aria-selected="false" tabindex="-1">装配</button>
      </div>
      <div class="pane-body">
        <div role="tabpanel" id="panel-bolt" aria-labelledby="tab-bolt" class="tabpanel"></div>
        <div role="tabpanel" id="panel-plates" aria-labelledby="tab-plates" class="tabpanel" hidden>
          <div id="plates-fields"></div>
          <div class="layers-head">
            <h2>板层 <small id="layer-count"></small></h2>
            <button type="button" id="add-layer" class="small">+ 添加板层</button>
          </div>
          <p class="hint">自螺栓头侧起排列。μT 指该层与下一层（ESV 末层与内螺纹件）之间的界面；μK 用于拧紧侧支承面。</p>
          <ol id="layers" class="layers"></ol>
        </div>
        <div role="tabpanel" id="panel-load" aria-labelledby="tab-load" class="tabpanel" hidden></div>
        <div role="tabpanel" id="panel-assembly" aria-labelledby="tab-assembly" class="tabpanel" hidden></div>
      </div>
    </section>

    <section class="pane section-pane" aria-label="二维剖面">
      <div class="pane-head">
        <h2>二维剖面</h2>
        <div class="tools">
          <span id="selected-layer" class="muted"></span>
          <button type="button" id="section-add-layer" class="small">+ 板层</button>
          <button type="button" id="section-remove-layer" class="small">− 删除选中层</button>
        </div>
      </div>
      <div id="section-wrap" class="section-wrap">
        <svg id="section" role="img" aria-label="螺栓连接二维剖面" preserveAspectRatio="xMidYMid meet"></svg>
        <p id="section-stale" class="section-stale" hidden>剖面未更新：请先修正标红输入</p>
      </div>
      <dl id="key-metrics" class="metrics"></dl>
    </section>

    <section class="pane result-pane" aria-label="计算结果">
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="结果视图">
          <button type="button" role="tab" id="rtab-checks" data-rtab="checks" aria-controls="panel-checks" aria-selected="true">安全系数</button>
          <button type="button" role="tab" id="rtab-values" data-rtab="values" aria-controls="panel-values" aria-selected="false" tabindex="-1">全部结果</button>
          <button type="button" role="tab" id="rtab-report" data-rtab="report" aria-controls="panel-report" aria-selected="false" tabindex="-1">报告</button>
        </div>
        <button type="button" id="export" class="small primary" disabled>导出 TXT</button>
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <div class="pane-body">
        <div role="tabpanel" id="panel-checks" aria-labelledby="rtab-checks" class="tabpanel">
          <div id="verdict-banner" class="banner" hidden></div>
          <table id="checks-table" class="grid">
            <thead><tr><th>校核项</th><th class="num">计算值</th><th class="num">要求</th><th>状态</th></tr></thead>
            <tbody></tbody>
          </table>
          <details id="provisional" class="notes" hidden>
            <summary>待核验数据来源 <span id="provisional-count"></span></summary>
            <ul></ul>
          </details>
          <ul id="warnings" class="warnings"></ul>
        </div>
        <div role="tabpanel" id="panel-values" aria-labelledby="rtab-values" class="tabpanel" hidden>
          <input id="value-filter" type="search" class="filter" placeholder="筛选符号或名称" aria-label="筛选结果">
          <table id="values-table" class="grid">
            <thead><tr><th>符号</th><th>名称</th><th class="num">数值</th><th>单位</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div role="tabpanel" id="panel-report" aria-labelledby="rtab-report" class="tabpanel" hidden>
          <pre id="report-preview" class="report"></pre>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
